<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品一覧 | Sample Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <header class="bg-white shadow-sm p-6 text-center text-2xl font-bold text-gray-800">
        <h1>Awesome Items</h1>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            
            <div class="bg-white p-6 rounded-xl shadow-md transition duration-300 hover:shadow-2xl hover:scale-105 cursor-pointer text-center">
                <div class="text-6xl mb-4">☕</div>
                <h2 class="text-lg font-semibold text-gray-700">コーヒー豆</h2>
                <p class="text-blue-600 font-bold mt-2">¥1,200</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md transition duration-300 hover:shadow-2xl hover:scale-105 cursor-pointer text-center">
                <div class="text-6xl mb-4">💻</div>
                <h2 class="text-lg font-semibold text-gray-700">ノートPC</h2>
                <p class="text-blue-600 font-bold mt-2">¥120,000</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md transition duration-300 hover:shadow-2xl hover:scale-105 cursor-pointer text-center">
                <div class="text-6xl mb-4">🎧</div>
                <h2 class="text-lg font-semibold text-gray-700">ヘッドホン</h2>
                <p class="text-blue-600 font-bold mt-2">¥15,000</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md transition duration-300 hover:shadow-2xl hover:scale-105 cursor-pointer text-center">
                <div class="text-6xl mb-4">📷</div>
                <h2 class="text-lg font-semibold text-gray-700">カメラ</h2>
                <p class="text-blue-600 font-bold mt-2">¥85,000</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md transition duration-300 hover:shadow-2xl hover:scale-105 cursor-pointer text-center">
                <div class="text-6xl mb-4">👟</div>
                <h2 class="text-lg font-semibold text-gray-700">スニーカー</h2>
                <p class="text-blue-600 font-bold mt-2">¥9,800</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md transition duration-300 hover:shadow-2xl hover:scale-105 cursor-pointer text-center">
                <div class="text-6xl mb-4">⌚</div>
                <h2 class="text-lg font-semibold text-gray-700">腕時計</h2>
                <p class="text-blue-600 font-bold mt-2">¥25,000</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md transition duration-300 hover:shadow-2xl hover:scale-105 cursor-pointer text-center">
                <div class="text-6xl mb-4">🎒</div>
                <h2 class="text-lg font-semibold text-gray-700">バックパック</h2>
                <p class="text-blue-600 font-bold mt-2">¥7,500</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md transition duration-300 hover:shadow-2xl hover:scale-105 cursor-pointer text-center">
                <div class="text-6xl mb-4">📱</div>
                <h2 class="text-lg font-semibold text-gray-700">スマートフォン</h2>
                <p class="text-blue-600 font-bold mt-2">¥98,000</p>
            </div>

        </div>
    </main>
</body>
</html>
